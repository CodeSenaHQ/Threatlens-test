<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 52" role="img" aria-label="ThreatLens logo — icon left">
  <!-- Brand-accent variant: icon on the left with cyan→blue gradient -->
  <defs>
    <linearGradient id="tlGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
  </defs>
  <!-- Geometric Logo Icon on the Left -->
  <polygon fill="url(#tlGrad)" fill-rule="evenodd" points="20,8 40,44 0,44 20,41 26.5,22.5 13.5,22.5"/>
  <!-- Brand Name on the Right -->
  <text x="54" y="36" font-family="Inter, Futura, 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">THREAT<tspan fill="url(#tlGrad)">LENS</tspan></text>
</svg>
